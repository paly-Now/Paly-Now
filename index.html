<style>

y{position:relative;z-index:1;max-width:650px}.eyebrow{color:#dba6ff;letter-spacing:2px;font-weight:800}.hero h1{font-size:64px;line-height:1.05;margin:13px 0}.hero p{color:#d1d1dc;line-height:2;font-size:17px}.meta{display:flex;gap:17px;flex-wrap:wrap;color:#c7c7d3;margin:17px 0}.actions{display:flex;gap:10px}.primary,.secondary{border-radius:12px;padding:12px 20px;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;font-weight:800}.primary{background:var(--grad);color:#fff;box-shadow:0 14px 35px #7948ff2b}.secondary{background:#ffffff10;border-color:#ffffff14;color:#fff}.content{padding:30px 6% 60px}.section{margin:0 0 40px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.section-head h2{margin:0;font-size:24px}.section-head button{background:none;border:0;color:#aaaabc;display:flex;gap:4px;align-items:center}.rail,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.card{min-width:0;cursor:pointer}.poster{height:300px;border-radius:15px;overflow:hidden;background:#151522;position:relative}.poster img{width:100%;height:100%;object-fit:cover;transition:.35s}.card:hover img{transform:scale(1.06);filter:brightness(.62)}.play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;opacity:0;transform:scale(.8);transition:.25s}.card:hover .play{opacity:1;transform:scale(1)}.badge{position:absolute;top:10px;right:10px;background:#000a;padding:5px 8px;border-radius:8px;font-size:11px}.rating{position:absolute;top:10px;left:10px;background:#000b;padding:5px 8px;border-radius:8px;font-size:12px}.card h3{font-size:15px;margin:10px 2px 2px}.card p{font-size:12px;color:#818193;margin:0 2px}.page{padding:60px 6%;min-height:70vh}.page-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.page-title h1{font-size:42px;margin:4px 0}.page-title small{color:#d49bff;letter-spacing:2px}.overlay{position:fixed;inset:0;background:#000c;backdrop-filter:blur(9px);z-index:100;display:grid;place-items:center;padding:22px}.modal{width:min(1050px,96vw);max-height:92vh;overflow:auto;background:#10101b;border:1px solid #29293b;border-radius:22px;box-shadow:0 30px 100px #000;position:relative}.detail{min-height:600px;background-size:cover;background-position:center;display:flex;align-items:end}.detail:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0b16 0%,#0b0b16e8 48%,#0b0b1630 100%),linear-gradient(0deg,#0b0b16,transparent 60%)}.detail-copy{position:relative;padding:70px;max-width:650px}.detail-copy h1{font-size:50px;margin:15px 0}.detail-copy p{line-height:2;color:#d1d1db}.close{position:absolute;top:16px;left:16px;z-index:2;border:0;background:#000a;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px}.watch{margin-top:18px;background:#fff;color:#111;border:0;border-radius:12px;padding:13px 20px;font-weight:800}.admin-page{padding:45px 6% 70px}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.admin-head h1{font-size:40px;margin:4px 0}.admin-head p{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:4px}.admin-tabs{display:flex;gap:7px;margin-bottom:18px;overflow:auto}.admin-tabs button{background:#12121f;border:1px solid var(--line);color:#aaaabc;padding:10px 14px;border-radius:10px;white-space:nowrap}.admin-tabs button.active{background:var(--grad);color:#fff;border-color:transparent}.admin-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid #1d1d2b;text-align:right}.table th{color:#77778a;font-size:12px}.thumb{width:42px;height:55px;border-radius:7px;object-fit:cover;vertical-align:middle;margin-left:9px}.rowbtn{border:0;background:#1a1a27;color:#bbb;padding:8px;border-radius:8px;margin-left:5px}.rowbtn.del{color:#ff7272}.form{display:grid;gap:13px}.form label{font-size:13px;color:#aaaabc}.form input,.form select,.form textarea{display:block;width:100%;margin-top:6px;background:#0a0a12;border:1px solid #29293a;color:#fff;padding:11px;border-radius:10px;outline:0}.form textarea{min-height:110px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex!important;align-items:center;gap:8px}.check input{width:auto!important;margin:0!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:11px 17px;border-radius:11px;z-index:300;font-weight:700}.empty{text-align:center;color:#77778a;padding:50px}.login{width:min(420px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}.login img{width:70px;display:block;margin:0 auto 10px}.login h2{text-align:center}.login p{text-align:center;color:var(--muted);font-size:13px}.login button{width:100%;border:0}.live-layout{display:grid;grid-template-columns:2fr 1fr;gap:18px}.live-player{background:#050508;border:1px solid var(--line);border-radius:18px;padding:10px}.live-screen{min-height:500px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#30205a 0,#09090f 50%);overflow:hidden}.live-placeholder{text-align:center;color:#aaaabc}.live-dot{width:14px;height:14px;border-radius:50%;background:#ff3f5e;display:inline-block;box-shadow:0 0 18px #ff3f5e;margin-bottom:9px}.channel-list{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;max-height:520px;overflow:auto}.channel{width:100%;display:flex;gap:10px;align-items:center;padding:10px;border:0;border-bottom:1px solid #1d1d2b;background:transparent;color:#fff;text-align:right;border-radius:12px}.channel:hover{background:#ffffff08}.channel img{width:45px;height:45px;object-fit:contain;border-radius:9px;background:#08080f}.channel b{display:block}.channel small{display:block;color:#77778a}.footer{text-align:center;color:#68687a;padding:30px;border-top:1px solid #151522}
@media(min-width:1600px){.content,.page,.admin-page{padding-left:8%;padding-right:8%}.hero{padding-left:10%;padding-right:10%}.poster{height:350px}.hero h1{font-size:76px}}@media(min-width:2000px){body{font-size:18px}.poster{height:410px}.rail,.grid{grid-template-columns:repeat(6,1fr)}}@media(min-width:1800px){button,.card{outline-offset:4px}button:focus-visible,.card:focus-visible{outline:2px solid #fff}}
@media(max-width:1150px){.nav{display:none}.menu{display:block}.nav.open{display:flex;position:absolute;top:78px;right:3%;left:3%;background:#11111d;border:1px solid var(--line);border-radius:14px;padding:10px;flex-wrap:wrap}.rail,.grid{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.live-layout{grid-template-columns:1fr}.live-screen{min-height:300px}.top{padding:0 4%;gap:8px}.brand span{display:none}.search{width:43px;padding:11px}.search input{display:none}.admin{padding:10px}.admin span{display:none}.hero{min-height:570px;padding:50px 6%}.hero h1{font-size:42px}.hero p{font-size:15px}.content,.page,.admin-page{padding-left:5%;padding-right:5%}.rail,.grid{grid-template-columns:repeat(2,1fr);gap:18px 11px}.poster{height:245px}.stats{grid-template-columns:1fr 1fr}.admin-head{flex-direction:column;align-items:flex-start}.admin-head h1{font-size:30px}.cols{grid-template-columns:1fr}.detail-copy{padding:90px 28px 40px}.detail-copy h1{font-size:36px}.table th:nth-child(2),.table td:nth-child(2),.table th:nth-child(4),.table td:nth-child(4){display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="./src/cloud-config.js"></script><script src="./src/cloud.js"></script><script>
const LOGO='./src/assets/play-now-logo.png';
const types={movies:'أفلام',series:'مسلسلات',programs:'برامج',cartoon:'كرتون'};
const LIVE_KEY='pn_live_config';
let liveConfig=JSON.parse(localStorage.getItem(LIVE_KEY)||'{"enabled":false,"provider":"IPTV","mode":"m3u","source":"","username":"","password":"","portal":"","channels":[]}');
const icons={movies:'🎬',series:'📺',programs:'🎙️',cartoon:'🧸'};
const seed=[
{id:1,title:'ليلة في المدينة',type:'movies',genre:'دراما',year:2026,rating:8.7,views:1200000,duration:'1س 52د',desc:'تجربة سينمائية درامية مليئة بالمفاجآت والمواقف الإنسانية.',image:'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1000&q=80',featured:true},
{id:2,title:'الخط الفاصل',type:'series',genre:'تشويق',year:2026,rating:9.1,views:980000,duration:'10 حلقات',desc:'مسلسل تشويقي عن أسرار تتكشف مع كل حلقة.',image:'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=1000&q=80',featured:true},
{id:3,title:'وراء الكواليس',type:'programs',genre:'ترفيه',year:2026,rating:8.2,views:740000,duration:'45د',desc:'برنامج ترفيهي يأخذك إلى ما لا تراه خلف الكاميرات.',image:'https://images.unsplash.com/photo-1598899134739-24c46f58f2e1?auto=format&fit=crop&w=1000&q=80'},
{id:4,title:'مغامرات نونو',type:'cartoon',genre:'أطفال',year:2026,rating:9.4,views:1800000,duration:'24 حلقة',desc:'مغامرات ممتعة وآمنة للصغار.',image:'https://images.unsplash.com/photo-1600965962361-9035dbfd1c50?auto=format&fit=crop&w=1000&q=80'},
{id:5,title:'الرحلة الأخيرة',type:'movies',genre:'أكشن',year:2025,rating:8.5,views:650000,duration:'2س 08د',desc:'رحلة لا يمكن الرجوع منها.',image:'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=80'},
{id:6,title:'بيت الأسرار',type:'series',genre:'غموض',year:2025,rating:8.9,views:1100000,duration:'12 حلقة',desc:'كل غرفة تخفي قصة.',image:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1000&q=80'},
{id:7,title:'ضحكة وبس',type:'programs',genre:'كوميديا',year:2025,rating:8.0,views:520000,duration:'32د',desc:'جرعة كوميديا خفيفة لكل أفراد الأسرة.',image:'https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=1000&q=80'},
{id:8,title:'كوكب الأصدقاء',type:'cartoon',genre:'مغامرات',year:2025,rating:9.0,views:1400000,duration:'26 حلقة',desc:'أصدقاء صغار ومغامرات كبيرة.',image:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?auto=format&fit=crop&w=1000&q=80'}];
let state={items:load('pn_items',seed),page:'home',search:'',lang:'ar',admin:false,adminTab:'content',edit:null,detail:null,menu:false,toast:''};
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function save(){localStorage.setItem('pn_items',JSON.stringify(state.items)); if(window.PNCloud?.enabled){Promise.all(state.items.map(x=>PNCloud.upsert(x))).catch(e=>console.warn('Cloud sync failed',e))}}
function setState(x){state={...state,...x};render()}
function fmt(n){if(n>=1000000)return (n/1000000).toFixed(1)+'M';if(n>=1000)return (n/1000).toFixed(0)+'K';return n}
function card(x){return `<article class="card" onclick="openDetail(${x.id})"><div class="poster"><img src="${x.image}" onerror="this.style.display='none'"><span class="badge">${types[x.type]}</span><span class="rating">★ ${x.rating}</span><span class="play">▶</span></div><h3>${x.title}</h3><p>${x.genre} • ${x.year} • ${fmt(x.views)} مشاهدة</p></article>`}
function section(title,arr){return `<section class="section"><div class="section-head"><h2>${title}</h2><button onclick="setState({page:'${title.includes('أفلام')?'movies':title.includes('مسلسلات')?'series':title.includes('برامج')?'programs':title.includes('كرتون')?'cartoon':'home'} )">عرض الكل ←</button></div><div class="rail">${arr.length?arr.map(card).join(''):'<div class="empty">لا يوجد محتوى بعد</div>'}</div></section>`}
function header(){return `<header class="top"><div class="brand" onclick="setState({page:'home'})"><img src="${LOGO}"><span>Play <b>Now</b></span></div><button class="menu" onclick="setState({menu:!state.menu})">☰</button><nav class="nav ${state.menu?'open':''}"><button class="${state.page==='home'?'active':''}" onclick="setState({page:'home',menu:false})">⌂ الرئيسية</button>${Object.entries(types).map(([k,v])=>`<button class="${state.page===k?'active':''}" onclick="setState({page:'${k}',menu:false})">${icons[k]} ${v}</button>`).join('')}${liveConfig.enabled?`<button class="${state.page==='live'?'active':''}" onclick="setState({page:'live',menu:false})">🔴 لايف</button>`:''}</nav><div class="tools"><div class="search">⌕<input placeholder="ابحث عن محتوى..." value="${esc(state.search)}" oninput="setState({search:this.value})"></div><button class="tool" onclick="setState({lang:state.lang==='ar'?'en':'ar'});document.documentElement.dir=state.lang==='ar'?'rtl':'ltr">🌐</button><button class="admin" onclick="state.admin?setState({admin:false}):login()">⚙ <span>${state.admin?'إغلاق الإدارة':'الإدارة'}</span></button></div></header>`}
function home(){let featured=state.items.find(x=>x.featured)||state.items[0];let popular=[...state.items].sort((a,b)=>b.views-a.views);return `<section class="hero" style="background-image:url('${featured.image}')"><div class="copy"><div class="eyebrow">PLAY NOW ORIGINAL</div><h1>${featured.title}</h1><p>${featured.desc}</p><div class="meta"><span>★ ${featured.rating}</span><span>${featured.year}</span><span>${featured.duration}</span></div><div class="actions"><button class="primary" onclick="openDetail(${featured.id})">▶ شاهد الآن</button><button class="secondary" onclick="toast('تمت الإضافة إلى قائمتك')">＋ قائمتي</button></div></div></section><main class="content">${section('🔥 الأكثر مشاهدة',popular)}${Object.entries(types).map(([k,v])=>section(icons[k]+' '+v,state.items.filter(x=>x.type===k))).join('')}</main>`}
function category(){let arr=state.items.filter(x=>(x.title+' '+x.genre).toLowerCase().includes(state.search.toLowerCase())&&x.type===state.page);return `<main class="page"><div class="page-title"><div><small>PLAY NOW</small><h1>${types[state.page]}</h1></div><span>${arr.length} محتوى</span></div><div class="grid">${arr.length?arr.map(card).join(''):'<div class="empty">لا توجد نتائج مطابقة</div>'}</div></main>`}
function live(){
 const channels=Array.isArray(liveConfig.channels)?liveConfig.channels:[];
 return `<main class="page"><div class="page-title"><div><small>PLAY NOW LIVE</small><h1>🔴 البث المباشر</h1></div><span>${channels.length} قناة</span></div>${!liveConfig.enabled?`<div class="empty">البث المباشر غير مفعّل من لوحة الإدارة.</div>`:`<div class="live-layout"><div class="live-player"><div class="live-screen" id="liveScreen"><div class="live-placeholder"><div class="live-dot"></div><h2>اختر قناة للمشاهدة</h2><p>سيتم فتح رابط البث المحدد من لوحة الإدارة.</p></div></div></div><div class="channel-list">${channels.length?channels.map((c,i)=>`<button class="channel" onclick="playChannel(${i})"><img src="${esc(c.logo||LOGO)}"><div><b>${esc(c.name||'قناة')}</b><small>${esc(c.group||'LIVE')}</small></div></button>`).join(''):'<div class="empty">لا توجد قنوات مستوردة بعد.</div>'}</div></div>`}</main>`;
}
function playChannel(i){const c=liveConfig.channels[i];if(!c)return;const el=document.getElementById('liveScreen');if(!el)return;const url=esc(c.url||'');el.innerHTML=`${url?`<video controls autoplay playsinline style="width:100%;height:100%;background:#000;border-radius:16px" src="${url}"></video>`:`<div class="live-placeholder"><div class="live-dot"></div><h2>${esc(c.name||'القناة')}</h2><p>لا يوجد رابط بث لهذه القناة.</p></div>`}`}
function detail(x){return `<div class="overlay" onclick="if(event.target===this)setState({detail:null})"><div class="modal detail" style="background-image:url('${x.image}')"><button class="close" onclick="setState({detail:null})">×</button><div class="detail-copy"><span class="eyebrow">${types[x.type]}</span><h1>${x.title}</h1><p>${x.desc}</p><div class="meta"><span>★ ${x.rating}</span><span>👁 ${fmt(x.views)}</span><span>${x.year}</span><span>${x.duration}</span></div><button class="watch" onclick="toast('المشغل جاهز للربط برابط الفيديو من لوحة الإدارة')">▶ تشغيل المحتوى</button></div></div></div>`}
function login(){state.detail='login';render()}
function loginModal(){return `<div class="overlay"><form class="login" onsubmit="event.preventDefault();if(window.PNCloud?.enabled){PNCloud.login(this.u.value,this.p.value).then(r=>{if(r?.data?.user){state.admin=true;state.detail=null;toast('تم تسجيل الدخول إلى الإدارة');render()}else toast('بيانات الدخول غير صحيحة')}).catch(()=>toast('تعذر تسجيل الدخول'))}else if(this.u.value==='admin'&&this.p.value==='123456'){state.admin=true;state.detail=null;toast('تم تسجيل الدخول إلى الإدارة');render()}else toast('بيانات الدخول التجريبية: admin / 123456')"><img src="${LOGO}"><h2>دخول الإدارة</h2><p>نسخة العرض: يمكنك تغيير نظام الدخول عند الربط بالسيرفر.</p><div class="form"><label>اسم المستخدم<input name="u" placeholder="admin"></label><label>كلمة المرور<input name="p" type="password" placeholder="123456"></label><button class="primary" type="submit">دخول آمن</button></div></form></div>`}
function admin(){let total=state.items.length,avg=(state.items.reduce((a,x)=>a+Number(x.rating),0)/Math.max(total,1)).toFixed(1);return `<main class="admin-page"><div class="admin-head"><div><div class="eyebrow">CONTROL CENTER</div><h1>لوحة إدارة Play Now</h1><p>تحكم في المحتوى، الأقسام، البانر والإعدادات من مكان واحد.</p></div><button class="primary" onclick="editItem()">＋ إضافة محتوى</button></div><div class="stats"><div class="stat"><small>إجمالي المحتوى</small><strong>${total}</strong></div><div class="stat"><small>أفلام</small><strong>${state.items.filter(x=>x.type==='movies').length}</strong></div><div class="stat"><small>مسلسلات</small><strong>${state.items.filter(x=>x.type==='series').length}</strong></div><div class="stat"><small>برامج</small><strong>${state.items.filter(x=>x.type==='programs').length}</strong></div><div class="stat"><small>متوسط التقييم</small><strong>★ ${avg}</strong></div></div><div class="admin-tabs">${[['content','المحتوى'],['categories','الأقسام'],['live','🔴 Live / IPTV'],['banner','البانر'],['settings','الإعدادات']].map(([k,v])=>`<button class="${state.adminTab===k?'active':''}" onclick="setState({adminTab:'${k}'})">${v}</button>`).join('')}</div>${adminPanel()}</main>`}
function adminPanel(){if(state.adminTab==='categories')return `<div class="admin-panel"><h2>الأقسام</h2><p style="color:var(--muted)">الأقسام الأساسية جاهزة، ويمكن إضافة تصنيفات فرعية لكل قسم من خلال بيانات المحتوى.</p><div class="grid">${Object.entries(types).map(([k,v])=>`<div class="stat"><span style="font-size:25px">${icons[k]}</span><strong>${v}</strong><small>${state.items.filter(x=>x.type===k).length} محتوى</small></div>`).join('')}</div></div>`;if(state.adminTab==='live')return `<div class="admin-panel"><h2>🔴 إدارة Live / IPTV</h2><p style="color:var(--muted)">تفعيل هذا القسم يتم من الإدارة فقط. يمكنك إدخال مصدر IPTV رسمي تملكه (M3U/M3U8 أو Xtream أو Portal) ثم استيراد القنوات. بيانات الاعتماد لا تظهر للمستخدمين.</p><form class="form" onsubmit="saveLiveConfig(event)"><label class="check"><input name="enabled" type="checkbox" ${liveConfig.enabled?'checked':''}> تفعيل قسم LIVE للمستخدمين</label><div class="cols"><label>المزوّد<select name="provider"><option ${liveConfig.provider==='IPTV'?'selected':''}>IPTV</option><option ${liveConfig.provider==='Nova'?'selected':''}>Nova</option></select></label><label>طريقة المصدر<select name="mode"><option value="m3u" ${liveConfig.mode==='m3u'?'selected':''}>M3U / M3U8</option><option value="xtream" ${liveConfig.mode==='xtream'?'selected':''}>Xtream Codes</option><option value="portal" ${liveConfig.mode==='portal'?'selected':''}>Portal</option></select></label></div><label>رابط M3U / M3U8 أو Portal<input name="source" value="${esc(liveConfig.source)}" placeholder="https://example.com/playlist.m3u"></label><div class="cols"><label>اسم المستخدم<input name="username" value="${esc(liveConfig.username)}"></label><label>كلمة المرور<input name="password" type="password" value="${esc(liveConfig.password)}"></label></div><label>رابط Portal<input name="portal" value="${esc(liveConfig.portal)}"></label><div class="actions"><button class="primary">حفظ وتفعيل</button><button type="button" class="secondary" onclick="importM3UFromFile()">استيراد ملف M3U</button><button type="button" class="secondary" onclick="testLiveSource()">اختبار المصدر</button></div><input id="m3uFile" type="file" accept=".m3u,.m3u8,text/plain" style="display:none" onchange="handleM3UFile(this.files[0])"><div class="stat"><small>القنوات المستوردة</small><strong>${liveConfig.channels.length}</strong></div></form></div>`;
if(state.adminTab==='banner')return `<div class="admin-panel"><h2>إدارة البانر الرئيسي</h2><p style="color:var(--muted)">يتم اختيار المحتوى المميز تلقائيًا من خلال علامة «مميز».</p>${state.items.map(x=>`<label class="check"><input type="radio" name="featured" ${x.featured?'checked':''} onchange="feature(${x.id})"> اجعل «${x.title}» المحتوى الرئيسي</label>`).join('')}</div>`;if(state.adminTab==='settings')return `<div class="admin-panel"><h2>إعدادات المنصة</h2><div class="form"><label>اسم المنصة<input value="Play Now" oninput="localStorage.setItem('pn_name',this.value)"></label><label>وصف المنصة<textarea oninput="localStorage.setItem('pn_desc',this.value)">منصة ترفيه رقمية حديثة للأفلام والمسلسلات والبرامج والكرتون.</textarea></label><button class="primary" onclick="toast('تم حفظ الإعدادات محليًا')">حفظ الإعدادات</button><button class="secondary" onclick="exportData()">تصدير نسخة احتياطية JSON</button><label>استيراد نسخة JSON<input type="file" accept="application/json" onchange="importData(this.files[0])"></label></div></div>`;return `<div class="admin-panel"><table class="table"><thead><tr><th>المحتوى</th><th>القسم</th><th>السنة</th><th>التقييم</th><th>إجراءات</th></tr></thead><tbody>${state.items.map(x=>`<tr><td><img class="thumb" src="${x.image}">${x.title}</td><td>${types[x.type]}</td><td>${x.year}</td><td>★ ${x.rating}</td><td><button class="rowbtn" onclick="editItem(${x.id})">✎</button><button class="rowbtn del" onclick="removeItem(${x.id})">🗑</button></td></tr>`).join('')}</tbody></table></div>`}
function editItem(id){let x=id?state.items.find(y=>y.id===id):{id:Date.now(),title:'محتوى جديد',type:'movies',genre:'دراما',year:2026,rating:8,views:0,duration:'',desc:'',image:'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1000&q=80',featured:false};state.edit={...x};render()}
function editModal(){let x=state.edit;return `<div class="overlay"><form class="modal" style="padding:25px;width:min(650px,95vw)" onsubmit="saveEdit(event)"><button type="button" class="close" onclick="setState({edit:null})">×</button><h2>${state.items.some(y=>y.id===x.id)?'تعديل المحتوى':'إضافة محتوى'}</h2><div class="form"><label>اسم المحتوى<input name="title" value="${esc(x.title)}" required></label><div class="cols"><label>القسم<select name="type">${Object.entries(types).map(([k,v])=>`<option value="${k}" ${x.type===k?'selected':''}>${v}</option>`).join('')}</select></label><label>السنة<input name="year" type="number" value="${x.year}"></label></div><div class="cols"><label>النوع/التصنيف<input name="genre" value="${esc(x.genre)}"></label><label>التقييم<input name="rating" type="number" step="0.1" min="0" max="10" value="${x.rating}"></label></div><label>رابط الصورة<input name="image" value="${esc(x.image)}"></label><div class="cols"><label>عدد المشاهدات<input name="views" type="number" value="${x.views}"></label><label>المدة<input name="duration" value="${esc(x.duration)}"></label></div><label>الوصف<textarea name="desc">${esc(x.desc)}</textarea></label><label class="check"><input name="featured" type="checkbox" ${x.featured?'checked':''}> محتوى مميز في البانر الرئيسي</label><div class="actions"><button type="button" class="secondary" onclick="setState({edit:null})">إلغاء</button><button class="primary">حفظ المحتوى</button></div></div></form></div>`}
function saveEdit(e){e.preventDefault();let f=new FormData(e.target),x={...state.edit,title:f.get('title'),type:f.get('type'),year:Number(f.get('year')),genre:f.get('genre'),rating:Number(f.get('rating')),image:f.get('image'),views:Number(f.get('views')),duration:f.get('duration'),desc:f.get('desc'),featured:f.get('featured')==='on'};if(x.featured)state.items=state.items.map(y=>({...y,featured:y.id===x.id}));if(state.items.some(y=>y.id===x.id))state.items=state.items.map(y=>y.id===x.id?x:y);else state.items=[x,...state.items];save();state.edit=null;toast('تم حفظ المحتوى بنجاح');render()}
function removeItem(id){if(confirm('حذف المحتوى نهائيًا؟')){state.items=state.items.filter(x=>x.id!==id);save();toast('تم حذف المحتوى');render()}}
function saveLiveConfig(e){e.preventDefault();const f=new FormData(e.target);liveConfig={...liveConfig,enabled:f.get('enabled')==='on',provider:f.get('provider'),mode:f.get('mode'),source:f.get('source')||'',username:f.get('username')||'',password:f.get('password')||'',portal:f.get('portal')||''};localStorage.setItem(LIVE_KEY,JSON.stringify(liveConfig));toast(liveConfig.enabled?'تم تفعيل LIVE من الإدارة':'تم تعطيل LIVE');render()}
function importM3UFromFile(){document.getElementById('m3uFile').click()}
function handleM3UFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{liveConfig.channels=parseM3U(String(r.result||''));localStorage.setItem(LIVE_KEY,JSON.stringify(liveConfig));toast(`تم استيراد ${liveConfig.channels.length} قناة`);render()};r.readAsText(file)}
function parseM3U(text){const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=[];for(let i=0;i<lines.length;i++){if(lines[i].startsWith('#EXTINF')){const info=lines[i],url=lines[i+1]&&!lines[i+1].startsWith('#')?lines[i+1]:'';const m=info.match(/tvg-logo="([^"]*)"/i),g=info.match(/group-title="([^"]*)"/i),name=info.split(',').slice(1).join(',').trim();if(url)out.push({name:name||'قناة',logo:m?.[1]||'',group:g?.[1]||'LIVE',url});}}return out}
async function testLiveSource(){if(!liveConfig.source){toast('أدخل رابط مصدر IPTV أولاً');return}try{const r=await fetch(liveConfig.source,{mode:'cors'});if(!r.ok)throw new Error();const text=await r.text();if(/#EXTM3U|#EXTINF/i.test(text)){liveConfig.channels=parseM3U(text);localStorage.setItem(LIVE_KEY,JSON.stringify(liveConfig));toast(`تم الاتصال واستيراد ${liveConfig.channels.length} قناة`);render()}else toast('المصدر استجاب لكنه ليس M3U قابلًا للقراءة')}catch(e){toast('تعذر الوصول للمصدر من المتصفح (قد يكون CORS أو يتطلب API)')}}
function feature(id){state.items=state.items.map(x=>({...x,featured:x.id===id}));save();toast('تم تحديث البانر');render()}
function openDetail(id){state.detail=state.items.find(x=>x.id===id);render()}
function toast(t){state.toast=t;render();clearTimeout(window._toast);window._toast=setTimeout(()=>{state.toast='';render()},2200)}
function exportData(){let blob=new Blob([JSON.stringify(state.items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='play-now-backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير النسخة الاحتياطية')}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{state.items=JSON.parse(r.result);save();toast('تم استيراد المحتوى');render()}catch{toast('ملف JSON غير صالح')}};r.readAsText(file)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';document.documentElement.lang=state.lang;let body=state.admin?admin():(state.page==='home'?home():(state.page==='live'&&liveConfig.enabled?live():category()));document.getElementById('app').innerHTML=header()+body+`<footer class="footer">© 2026 Play Now — منصة ترفيه رقمية حديثة</footer>${state.detail==='login'?loginModal():state.detail&&state.detail.id?detail(state.detail):''}${state.edit?editModal():''}${state.toast?`<div class="toast">${state.toast}</div>`:''}`}
(async()=>{await PNCloud?.init?.(); if(PNCloud?.enabled){const cloudItems=await PNCloud.loadItems(); if(cloudItems?.length){state.items=cloudItems;save()}} render()})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
</body></html>
